name: Hubble UDF MAST manifest

on:
  push:
    branches:
      - "work/fv-legacy-provenance-20261113"
    paths:
      - "TOOLS/query_hubble_udf_mast.py"
      - ".github/workflows/hubble-udf-mast-manifest.yml"
  pull_request:
    paths:
      - "TOOLS/query_hubble_udf_mast.py"
      - ".github/workflows/hubble-udf-mast-manifest.yml"
  workflow_dispatch:

concurrency:
  group: fv-legacy-provenance-branch4
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  query-mast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Astroquery
        run: python -m pip install --upgrade astroquery
      - name: Query public MAST observation and product metadata
        run: python TOOLS/query_hubble_udf_mast.py --output-dir hubble-mast-manifest
      - name: Upload MAST manifest
        uses: actions/upload-artifact@v4
        with:
          name: hubble-udf-mast-manifest
          path: hubble-mast-manifest/
          if-no-files-found: error
          retention-days: 30

      - name: Commit MAST provenance manifest (push runs only)
        if: github.event_name == 'push'
        run: |
          DEST="examples/telescope/hubble/Telescope_Hubble_UDF_Stitching/provenance/MAST_2026-11-13"
          mkdir -p "$DEST"
          cp hubble-mast-manifest/*.json "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Record Hubble UDF MAST exposure and product manifest"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

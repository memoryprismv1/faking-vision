name: Example asset SHA-256 manifest

on:
  push:
    branches:
      - "work/fv-legacy-provenance-followup-20261113"
    paths:
      - "examples/**"
      - "TOOLS/build_example_asset_manifest.py"
      - ".github/workflows/example-asset-hash-manifest.yml"
      - "docs/provenance/legacy_source_registry.json"
  pull_request:
    paths:
      - "examples/**"
      - "TOOLS/build_example_asset_manifest.py"
      - ".github/workflows/example-asset-hash-manifest.yml"
      - "docs/provenance/legacy_source_registry.json"
  workflow_dispatch:

concurrency:
  group: fv-legacy-provenance-branch4
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hash-example-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build SHA-256 inventory
        run: python TOOLS/build_example_asset_manifest.py
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: example-asset-sha256-manifest
          path: docs/provenance/example_asset_hashes.json
          retention-days: 30
      - name: Commit manifest (push runs only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/provenance/example_asset_hashes.json
          if ! git diff --cached --quiet; then
            git commit -m "Record SHA-256 hashes for example assets"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

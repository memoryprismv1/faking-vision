name: FV environmental workbench browser tests

on:
  push:
    branches:
      - work/fv-docs-skill-cleanup-20261111
    paths:
      - 'PACKETS/tools/FV_Edit_Visual_Workbench.html'
      - 'PACKETS/tools/FV_Media_Object_Editor_MVP.html'
      - 'tests/browser/**'
      - 'SPECIFICATION/FV_Viewpoint_Schema.json'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fv-environment-workbench-browser.yml'
  pull_request:
    paths:
      - 'PACKETS/tools/FV_Edit_Visual_Workbench.html'
      - 'PACKETS/tools/FV_Media_Object_Editor_MVP.html'
      - 'tests/browser/media-object-editor.spec.js'
      - 'SPECIFICATION/FV_Viewpoint_Schema.json'
      - 'tests/browser/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fv-environment-workbench-browser.yml'
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare real CCTV media excerpt
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fL --retry 3 -o "$RUNNER_TEMP/fv-cctv-source.webm" "https://commons.wikimedia.org/wiki/Special:Redirect/file/BLK-HDPTZ12_Security_Camera_Parkng_Lot_Surveillance_Video.webm"
          ffmpeg -hide_banner -loglevel error -i "$RUNNER_TEMP/fv-cctv-source.webm" -ss 17 -t 14 -c copy -avoid_negative_ts make_zero "$RUNNER_TEMP/fv-cctv-real-clip.webm"
          test -s "$RUNNER_TEMP/fv-cctv-real-clip.webm"
          echo "FV_REAL_MEDIA_PATH=$RUNNER_TEMP/fv-cctv-real-clip.webm" >> "$GITHUB_ENV"
      - run: npm install --no-save http-server
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fv-environment-workbench-playwright-results
          path: test-results/
          if-no-files-found: ignore

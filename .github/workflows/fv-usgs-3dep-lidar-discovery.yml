name: FV USGS 3DEP LiDAR — contiguous tile discovery

on:
  push:
    branches:
      - experiment/hst-single-visit-ngc3370
    paths:
      - ".github/workflows/fv-usgs-3dep-lidar-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query USGS TNM for LAZ tiles around Iowa State campus
        run: |
          python -m pip install --upgrade pip requests
          mkdir -p lidar-discovery
          cat > /tmp/discover.py <<'PY'
          import json, pathlib, requests
          from collections import Counter

          bbox = "-93.69,42.02,-93.65,42.04"  # WGS84: west,south,east,north
          params = {"bbox": bbox, "datasets": "Lidar Point Cloud (LPC)", "prodFormats": "LAZ", "max": 100, "outputFormat": "JSON"}
          endpoint = "https://tnmaccess.nationalmap.gov/api/v1/products"
          response = requests.get(endpoint, params=params, timeout=(20, 120), headers={"User-Agent": "FV-3DEP-discovery/1.0"})
          response.raise_for_status()
          payload = response.json()
          items = payload.get("items", [])
          print("TNM query:", response.url)
          print("TNM total:", payload.get("total"), "returned:", len(items))

          rows = []
          for item in items:
              rows.append({
                  "title": item.get("title"),
                  "sourceId": item.get("sourceId"),
                  "sourceName": item.get("sourceName"),
                  "publicationDate": item.get("publicationDate"),
                  "format": item.get("format"),
                  "sizeInBytes": item.get("sizeInBytes"),
                  "downloadURL": item.get("downloadURL"),
                  "boundingBox": item.get("boundingBox"),
                  "metadataURL": item.get("metaUrl"),
                  "raw": item,
              })
          counts = Counter(str(r["sourceName"] or r["sourceId"]) for r in rows)
          report = {"query": {"endpoint": endpoint, "parameters": params, "bbox_crs": "EPSG:4326"}, "total": payload.get("total"), "returned": len(items), "project_counts": dict(counts), "products": rows, "note": "Discovery only; no LAZ source files downloaded."}
          out = pathlib.Path("lidar-discovery")
          (out / "tnm_lidar_inventory.json").write_text(json.dumps(report, indent=2) + "\n")
          lines = ["# USGS 3DEP LiDAR discovery", "", f"- Query bbox (WGS84): {bbox}", f"- TNM total: {payload.get('total')}", f"- Returned products: {len(items)}", "", "| Product | Project/source | Format | Bytes | Download URL |", "|---|---|---:|---:|---|"]
          for r in rows:
              lines.append(f"| {r['title']} | {r['sourceName'] or r['sourceId']} | {r['format']} | {r['sizeInBytes']} | {r['downloadURL']} |")
          lines += ["", "No downloads were performed. Full API product records are preserved in the JSON inventory."]
          (out / "REPORT.md").write_text("\n".join(lines) + "\n")
          print((out / "REPORT.md").read_text())
          if not items:
              raise SystemExit("TNM returned no LAZ products for this AOI; no download attempted.")
          PY
          python /tmp/discover.py
      - name: Upload discovery inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fv-usgs-3dep-lidar-discovery
          path: lidar-discovery/
          if-no-files-found: warn
          retention-days: 30

name: FV assemble — public dataset intake receipts

on:
  push:
    branches:
      - work/hubble-ngc104-fv
      - experiment/hst-single-visit-ngc3370
    paths:
      - ".github/workflows/fv-assemble-dataset-intake.yml"

permissions:
  contents: read

jobs:
  lidar_ept_fv_packet:
    if: ${{ contains(github.event.head_commit.message, '[lidar-fv-packet]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable assembled cloud and ground-grid evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lidar-fv-packet/input/cloud lidar-fv-packet/input/ground-grid
          gh run download 42820788907 --repo "$GITHUB_REPOSITORY" \
            --name fv-usgs-ia-eastern-1-exact-record-deduplicated \
            --dir lidar-fv-packet/input/cloud
          gh run download 42822586174 --repo "$GITHUB_REPOSITORY" \
            --name fv-usgs-ia-eastern-1-observed-ground-grid \
            --dir lidar-fv-packet/input/ground-grid
      - name: Build FV assembly packet from verified spatial evidence
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          from datetime import datetime,timezone
          root=pathlib.Path("lidar-fv-packet")
          packet=root/"PKT-USGS-IA-EASTERN-1-ASSEMBLE-001"
          (packet/"snapshot/objs").mkdir(parents=True,exist_ok=True)
          (packet/"audit").mkdir(parents=True,exist_ok=True)
          clouds=list((root/"input/cloud").rglob("ia_eastern_1_four_window_exact_record_deduplicated.laz"))
          if len(clouds)!=1: raise SystemExit(f"Expected exactly one deduplicated LAZ, found {clouds}")
          cloud=clouds[0]
          def sha256(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              return h.hexdigest()
          cloud_hash=sha256(cloud)
          expected_cloud_hash="2991d84b6f87566eb587963a70c76d4f293365a327f6fd41935e2ba1dbc85249"
          if cloud_hash!=expected_cloud_hash: raise SystemExit(f"Cloud checksum mismatch: {cloud_hash}")
          cloud_copy=packet/"snapshot/objs/assembled_point_cloud.laz"
          shutil.copy2(cloud,cloud_copy)
          grid_receipts=list((root/"input/ground-grid").rglob("ground_surface_receipt.json"))
          if len(grid_receipts)!=1: raise SystemExit(f"Expected one ground-grid receipt, found {grid_receipts}")
          grid=json.loads(grid_receipts[0].read_text())
          if grid["source_sha256"]!=cloud_hash: raise SystemExit("Ground grid does not reference this exact cloud")
          image_files=list((root/"input/ground-grid").rglob("*.png"))
          if len(image_files)!=2: raise SystemExit(f"Expected two ground-grid visualizations, found {image_files}")
          for p in image_files: shutil.copy2(p,packet/"snapshot/objs"/p.name)
          packet_id="PKT-USGS-IA-EASTERN-1-ASSEMBLE-001"
          windows=[
            {"window_id":"NW","bounds_epsg3857_m":[-10180725.5,5067860.0,-10180225.5,5068360.0],"source_point_count":2223690,"source_sha256":"7bc4284e1e8f3fc0f408e0e27bf4ca9d5f63331d6cc56a509913dfb3140695"},
            {"window_id":"NE","bounds_epsg3857_m":[-10180275.5,5067860.0,-10179775.5,5068360.0],"source_point_count":2343561,"source_sha256":"513e67758c689973dcb2ee13784fad83c32780e2f8eff596b276377cfdc8ada3"},
            {"window_id":"SW","bounds_epsg3857_m":[-10180725.5,5067410.0,-10180225.5,5067910.0],"source_point_count":1006484,"source_sha256":"1d263deaac83cc9a5da967bddc683795e60394a25d04a13c83ca8c76b90e8eda"},
            {"window_id":"SE","bounds_epsg3857_m":[-10180275.5,5067410.0,-10179775.5,5067910.0],"source_point_count":1540658,"source_sha256":"f91c677e1449c1665338c044a7cd81c492a0059cabd3dab2185d109a10ed680a"}
          ]
          msrm={
            "packet_id":packet_id,
            "global_coordinate_system":{"horizontal_crs":"EPSG:3857","horizontal_units":"metres","vertical_crs":"unresolved in source metadata","z_reference":"source Z values retained unchanged; no vertical datum or geoid conversion asserted"},
            "registration":{"method":"coordinate-preserving assembly in the common source CRS","transform_applied":"none","pose_estimation":"not required; source coordinates already share EPSG:3857","icp_or_image_registration":"not performed","overlap_handling":"exact full-record duplicate removal, documented in assembly receipt","unresolved_registration_conflicts":[]},
            "scenes":[{"scene_id":"ASSEMBLED_IA_EASTERN_1_950M","label":"Four overlapping 500 m source windows assembled into one 950 m × 950 m point-cloud extent","spatial_representation":{"point_cloud":"snapshot/objs/assembled_point_cloud.laz","point_count":6386838,"sha256":cloud_hash,"bounds_epsg3857_m":[-10180725.5,5067410.0,-10179775.5,5068360.0],"extent_m":[950,950]},"coverage":{"all_point_10m_grid":{"occupied_cells":9019,"total_cells":9025,"occupancy_fraction":0.9993351800554017},"observed_class_2_ground_2m_grid":{"occupied_cells":grid["grid"]["occupied_ground_cells"],"total_cells":grid["grid"]["total_cells"],"occupancy_fraction":grid["grid"]["occupancy_fraction"]}},"source_windows":[w["window_id"] for w in windows]}],
            "source_windows":windows,
            "provenance":{"upstream_artifact":"fv-usgs-ia-eastern-1-exact-record-deduplicated","upstream_run_id":42820788907,"source_ept":"https://s3-us-west-2.amazonaws.com/usgs-lidar-public/IA_Eastern_1_2019/ept.json","source_dataset":"IA_Eastern_1_2019","source_point_count_before_dedup":7114393,"assembled_point_count_after_exact_record_dedup":6386838,"removed_exact_duplicate_records":727555,"source_window_step_m":450,"source_window_size_m":500,"nominal_overlap_m":50}
          }
          oi={
            "packet_id":packet_id,"spec_version":"0.24","operation":"fv assemble",
            "inventory_lock":False,
            "inventory_status":"NOT_PERFORMED",
            "inventory_scope":"This packet records spatial assembly of source LiDAR observations only. No semantic object analysis or object promotion has been performed. An empty entity list is not a claim that no objects exist.",
            "source_provenance":{"dataset":"USGS 3DEP IA_Eastern_1_2019","source_ept":"https://s3-us-west-2.amazonaws.com/usgs-lidar-public/IA_Eastern_1_2019/ept.json","source_crs":"EPSG:3857 horizontal; vertical reference unresolved","source_windows":windows,"assembled_point_cloud":{"path":"snapshot/objs/assembled_point_cloud.laz","point_count":6386838,"sha256":cloud_hash}},
            "entities":[],
            "assembly_vs_merge":{"assembly_did":"Preserve common source coordinates and combine four overlapping LiDAR windows into one spatial point-cloud representation; exact duplicate point records removed with an audit trail.","assembly_did_not":"Perform semantic object detection, assign object identities, classify unclassified points, estimate new transforms, infer a vertical datum, or normalize identities across independent packets."}
          }
          td={
            "packet_id":packet_id,"spec_version":"0.24","operation":"fv assemble",
            "note":"Assembly-step log records the four source windows entering the common-coordinate representation. It is not a claim of source acquisition time order.",
            "timeline":[{"interval_id":f"ASSEMBLE_STEP_{i:04d}","scene_id":"ASSEMBLED_IA_EASTERN_1_950M","step_index":i,"action":f"Register source window {w['window_id']} by retaining its source EPSG:3857 coordinates; no pose correction applied.","visible":[],"provenance":{"source_window_id":w["window_id"],"source_point_count":w["source_point_count"],"source_sha256":w["source_sha256"]}} for i,w in enumerate(windows)]
          }
          pc={"packet_id":packet_id,"constants":[{"name":"horizontal_coordinate_reference","value":"EPSG:3857","units":"metres"},{"name":"vertical_reference","value":"unresolved in EPT/LAS metadata; source Z values preserved without conversion"},{"name":"source_format","value":"LAS 1.4 point format 6, compressed LAZ"},{"name":"ground_classification","value":"LAS classification code 2 used only for the observed-ground diagnostic grid; no reclassification performed"}]}
          manifest={"packet_id":packet_id,"snapshots":{"assembled_point_cloud":"snapshot/objs/assembled_point_cloud.laz - exact-record-deduplicated source-coordinate point cloud","observed_ground_mean_z":"snapshot/objs/class2_ground_mean_z_2m.png - 2 m cell means from class-2 returns; empty cells remain NoData","observed_ground_within_cell_range":"snapshot/objs/class2_within_cell_z_range_2m.png - within-cell Z range from class-2 returns"}}
          dispute={"packet_id":packet_id,"status":"none","disputes":[],"note":"No registration dispute was detected by this coordinate-preserving assembly. Semantic inventory is not performed and remains unlocked; this is not a rendering-ready packet."}
          receipt={"status":"ASSEMBLY_PACKET_PROTOTYPE_CREATED","packet_id":packet_id,"cloud_sha256":cloud_hash,"cloud_point_count":6386838,"source_window_count":4,"ground_grid_source_sha256":grid["source_sha256"],"ground_class_point_count":grid["ground_point_count"],"ground_grid_occupancy":grid["grid"]["occupancy_fraction"],"checks":["source cloud SHA256 matched the upstream deduplicated artifact receipt","ground-grid receipt references the same cloud SHA256","all packet JSON files parse","point-cloud file copied byte-for-byte","source window checksums and point counts carried forward from extraction receipts"],"limitations":["No semantic object inventory performed; OI remains unlocked.","No ICP or pose estimation; assembly relies on common source coordinates.","Vertical datum unresolved; Z values are retained unchanged.","Ground grid is observed class-2 cell statistics, not a validated DTM or mesh.","No renderer compilation performed."]}
          packet_provenance={
            "schema_version":"1.0","packet_id":packet_id,"fv_spec_version":"0.24",
            "packet_generator":{"agent_id":"ChatGPT","model_provider":"OpenAI","model_name":"GPT-6","model_version":None,"run_id":None,"generated_at":datetime.now(timezone.utc).isoformat(),"identity_source":"agent_declaration"},
            "media":{"media_id":"assembled_point_cloud.laz","media_type":"other","sha256":cloud_hash,"media_generator":None,"embedded_provenance":[],"attribution":{"publisher":"U.S. Geological Survey","program":"3D Elevation Program (3DEP)","dataset":"IA_Eastern_1_2019","source_url":"https://s3-us-west-2.amazonaws.com/usgs-lidar-public/IA_Eastern_1_2019/ept.json"}}
          }
          files={"MSRM.json":msrm,"OI.json":oi,"TD.json":td,"PC.json":pc,"snapshot/manifest.json":manifest,"dispute.json":dispute,"packet_provenance.json":packet_provenance,"audit/ASSEMBLY_RECEIPT.json":receipt}
          for name,obj in files.items():
              p=packet/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(obj,indent=2)+"\n")
          readme="""# USGS IA Eastern 1 — FV Assemble packet prototype

          Packet ID: PKT-USGS-IA-EASTERN-1-ASSEMBLE-001
          Operation: fv assemble
          FV specification reference: 0.24

          This packet is a source-grounded spatial assembly prototype. It combines four overlapping USGS 3DEP EPT windows in their common EPSG:3857 coordinates. No new transform was estimated or applied. Exact duplicate point records were removed upstream, with the immutable source cloud and checksums retained.

          The packet deliberately does not claim semantic object recognition. OI.entities is empty and inventory_lock is false because semantic analysis has not been performed. Empty means not assessed, not that the landscape contains no objects.

          The vertical reference is unresolved in the source metadata. Z values are preserved as supplied. The two ground-grid images show observed LAS class-2 returns only; empty cells remain NoData. They are not a validated bare-earth DTM.

          Files: MSRM.json (spatial representation and registration), OI.json (inventory scope and provenance), TD.json (assembly steps), PC.json (project constants), dispute.json (current gate), snapshot/manifest.json (preserved evidence references), audit/ASSEMBLY_RECEIPT.json (checks and limitations).
          """
          (packet/"README.md").write_text(readme)
          # Structural and cross-file consistency checks.
          for name in ["MSRM.json","OI.json","TD.json","PC.json","dispute.json","packet_provenance.json","snapshot/manifest.json","audit/ASSEMBLY_RECEIPT.json"]:
              json.loads((packet/name).read_text())
          assert msrm["scenes"][0]["spatial_representation"]["sha256"]==oi["source_provenance"]["assembled_point_cloud"]["sha256"]
          assert td["timeline"] and len(td["timeline"])==4
          assert oi["inventory_lock"] is False and oi["entities"]==[]
          assert receipt["ground_grid_source_sha256"]==cloud_hash
          assert sha256(cloud_copy)==cloud_hash
          print(json.dumps({"status":"PACKET_STRUCTURAL_CHECKS_PASS","packet_id":packet_id,"files":sorted(files.keys()),"point_count":6386838,"cloud_sha256":cloud_hash,"ground_grid_occupancy":grid["grid"]["occupancy_fraction"]},indent=2))
          PY
      - name: Upload FV packet prototype
        uses: actions/upload-artifact@v4
        with:
          name: fv-usgs-ia-eastern-1-assemble-packet-prototype
          path: lidar-fv-packet/PKT-USGS-IA-EASTERN-1-ASSEMBLE-001/
          if-no-files-found: error
          retention-days: 30
  lidar_ept_ground_surface:
    if: ${{ contains(github.event.head_commit.message, '[lidar-ground-surface]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable deduplicated point cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lidar-ground-surface/input
          gh run download 42820788907 --repo "$GITHUB_REPOSITORY" \
            --name fv-usgs-ia-eastern-1-exact-record-deduplicated \
            --dir lidar-ground-surface/input
      - name: Install ground-surface analysis libraries
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lidar
          create-args: >-
            -c conda-forge
            python
            laspy
            lazrs-python
            numpy
            matplotlib
            pyproj
          cache-environment: true
          init-shell: bash
      - name: Build observed-ground-only grid without interpolating gaps
        shell: bash -el {0}
        run: |
          cat > /tmp/ground_surface.py <<'PY'
          import hashlib,json,pathlib
          import laspy,numpy as np,matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          root=pathlib.Path("lidar-ground-surface")
          files=list((root/"input").rglob("ia_eastern_1_four_window_exact_record_deduplicated.laz"))
          if len(files)!=1:raise RuntimeError(f"Expected one deduplicated cloud, got {files}")
          src=files[0];out=root/"output";out.mkdir(parents=True,exist_ok=True)
          audit=root/"audit";audit.mkdir(parents=True,exist_ok=True)
          h=hashlib.sha256()
          with src.open("rb") as f:
              for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
          source_hash=h.hexdigest()
          # Exact XY bounds from header; use only LAS class 2 records, retaining
          # the complete source cloud as the immutable input.
          with laspy.open(src) as r:
              hdr=r.header;crs=hdr.parse_crs()
              if crs is None:raise RuntimeError("Missing CRS")
              xmin,ymin=map(float,hdr.mins[:2]);xmax,ymax=map(float,hdr.maxs[:2])
          cell=2.0
          nx=int(np.ceil((xmax-xmin)/cell));ny=int(np.ceil((ymax-ymin)/cell))
          size=nx*ny
          counts=np.zeros(size,dtype=np.int64);sums=np.zeros(size,dtype=np.float64)
          zmins=np.full(size,np.inf);zmaxs=np.full(size,-np.inf)
          class_counts={};ground_n=0;all_n=0
          with laspy.open(src) as r:
              for pts in r.chunk_iterator(250_000):
                  cls=np.asarray(pts.classification)
                  vals,cnts=np.unique(cls,return_counts=True)
                  for v,k in zip(vals,cnts):class_counts[str(int(v))]=class_counts.get(str(int(v)),0)+int(k)
                  all_n+=len(pts)
                  mask=cls==2
                  if not np.any(mask):continue
                  x=np.asarray(pts.x)[mask];y=np.asarray(pts.y)[mask];z=np.asarray(pts.z)[mask]
                  ix=np.clip(((x-xmin)/cell).astype(np.int64),0,nx-1)
                  iy=np.clip(((y-ymin)/cell).astype(np.int64),0,ny-1)
                  idx=ix*ny+iy
                  counts+=np.bincount(idx,minlength=size)
                  sums+=np.bincount(idx,weights=z,minlength=size)
                  np.minimum.at(zmins,idx,z);np.maximum.at(zmaxs,idx,z)
                  ground_n+=len(z)
          if all_n!=hdr.point_count:raise RuntimeError("Full point count changed during read")
          mean=np.divide(sums,counts,out=np.full(size,np.nan),where=counts>0)
          relief=np.where(counts>0,zmaxs-zmins,np.nan)
          occupied=int(np.count_nonzero(counts));grid=mean.reshape(nx,ny)
          fig,ax=plt.subplots(figsize=(10,8))
          im=ax.imshow(grid.T,origin="lower",extent=[xmin,xmax,ymin,ymax],aspect="equal")
          ax.set(title="Observed class-2 points — 2 m cell mean Z (no interpolation)",xlabel="X (EPSG:3857 metres)",ylabel="Y (EPSG:3857 metres)")
          fig.colorbar(im,ax=ax,label="Mean Z (source units)")
          fig.tight_layout();fig.savefig(out/"class2_ground_mean_z_2m.png",dpi=180);plt.close(fig)
          fig,ax=plt.subplots(figsize=(10,8))
          im=ax.imshow(relief.reshape(nx,ny).T,origin="lower",extent=[xmin,xmax,ymin,ymax],aspect="equal")
          ax.set(title="Within-cell Z range of class-2 returns (2 m cells)",xlabel="X (EPSG:3857 metres)",ylabel="Y (EPSG:3857 metres)")
          fig.colorbar(im,ax=ax,label="Max Z - min Z (source units)")
          fig.tight_layout();fig.savefig(out/"class2_within_cell_z_range_2m.png",dpi=180);plt.close(fig)
          report={
            "status":"OBSERVED_GROUND_GRID_COMPLETE",
            "source_file":src.name,"source_sha256":source_hash,
            "input_point_count":all_n,"class_counts":class_counts,
            "ground_class_code_used":2,"ground_point_count":ground_n,
            "crs_wkt":crs.to_wkt(),"xy_bounds":[xmin,ymin,xmax,ymax],
            "grid":{"cell_size_m":cell,"columns":nx,"rows":ny,"total_cells":size,"occupied_ground_cells":occupied,"occupancy_fraction":occupied/size,"empty_cells_left_as_nodata":size-occupied},
            "outputs":["class2_ground_mean_z_2m.png","class2_within_cell_z_range_2m.png"],
            "limitations":["Only records explicitly classified as LAS class 2 were used; all other classes remain in the source cloud.","The grid stores observed per-cell means only. Empty cells are NoData; no interpolation or mesh generation was performed.","This is a terrain-evidence diagnostic, not a validated bare-earth DTM."]
          }
          (audit/"ground_surface_receipt.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
          python /tmp/ground_surface.py
      - name: Upload observed ground grid and receipt
        uses: actions/upload-artifact@v4
        with:
          name: fv-usgs-ia-eastern-1-observed-ground-grid
          path: |
            lidar-ground-surface/output/
            lidar-ground-surface/audit/
          if-no-files-found: error
          retention-days: 30
  lidar_ept_vertical_extremes:
    if: ${{ contains(github.event.head_commit.message, '[lidar-vertical-extremes]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download exact-record deduplicated cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lidar-vertical-extremes/input
          gh run download 42820788907 --repo "$GITHUB_REPOSITORY" \
            --name fv-usgs-ia-eastern-1-exact-record-deduplicated \
            --dir lidar-vertical-extremes/input
      - name: Install point-record inspection libraries
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lidar
          create-args: >-
            -c conda-forge
            python
            laspy
            lazrs-python
            numpy
            pyproj
          cache-environment: true
          init-shell: bash
      - name: Inspect exact vertical extremes and classifications
        shell: bash -el {0}
        run: |
          cat > /tmp/vertical_extremes.py <<'PY'
          import heapq,json,pathlib
          import laspy
          import numpy as np
          root=pathlib.Path("lidar-vertical-extremes")
          files=list((root/"input").rglob("ia_eastern_1_four_window_exact_record_deduplicated.laz"))
          if len(files)!=1:raise RuntimeError(f"Expected one cloud, got {files}")
          src=files[0]
          low=[];high=[];class_counts={};n=0
          def record(p,i):
              return {"x":float(np.asarray(p.x)[i]),"y":float(np.asarray(p.y)[i]),"z":float(np.asarray(p.z)[i]),"classification":int(np.asarray(p.classification)[i]),"intensity":int(np.asarray(p.intensity)[i]),"gps_time":float(np.asarray(p.gps_time)[i]),"point_source_id":int(np.asarray(p.point_source_id)[i]),"return_number":int(np.asarray(p.return_number)[i]),"number_of_returns":int(np.asarray(p.number_of_returns)[i])}
          with laspy.open(src) as reader:
              hdr=reader.header
              crs=hdr.parse_crs()
              for pts in reader.chunk_iterator(250_000):
                  z=np.asarray(pts.z)
                  cls=np.asarray(pts.classification)
                  vals,cnts=np.unique(cls,return_counts=True)
                  for v,k in zip(vals,cnts):class_counts[str(int(v))]=class_counts.get(str(int(v)),0)+int(k)
                  # Keep exact extrema and a bounded list of highest/lowest records.
                  for i in np.argsort(z)[:min(100,len(z))]:
                      low.append((float(z[i]),record(pts,i)))
                  for i in np.argsort(z)[-min(100,len(z)):]:
                      high.append((float(z[i]),record(pts,i)))
                  low=heapq.nsmallest(100,low,key=lambda x:x[0])
                  high=heapq.nlargest(100,high,key=lambda x:x[0])
                  n+=len(pts)
          low_records=[x[1] for x in low];high_records=[x[1] for x in sorted(high,key=lambda x:x[0],reverse=True)]
          zlo=np.array([x["z"] for x in low_records]);zhi=np.array([x["z"] for x in high_records])
          result={
            "status":"VERTICAL_EXTREMES_AUDIT_COMPLETE",
            "point_count":n,
            "crs_wkt":crs.to_wkt() if crs else None,
            "las_point_format":int(hdr.point_format.id),
            "z_scale":float(hdr.scales[2]),
            "exact_lowest_100":low_records,
            "exact_highest_100":high_records,
            "classification_counts":class_counts,
            "extreme_classification_summary":{
              "lowest_100":{k:sum(1 for x in low_records if str(x["classification"])==k) for k in class_counts},
              "highest_100":{k:sum(1 for x in high_records if str(x["classification"])==k) for k in class_counts}
            },
            "warning":"Z extremes are exact stored coordinates. Their physical interpretation depends on source vertical reference metadata; no outlier is removed or reclassified."
          }
          out=root/"audit";out.mkdir(parents=True,exist_ok=True)
          (out/"vertical_extremes_receipt.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps({"status":result["status"],"point_count":n,"lowest_10":low_records[:10],"highest_20":high_records[:20],"classification_counts":class_counts,"z_scale":result["z_scale"],"crs_wkt":result["crs_wkt"]},indent=2))
          PY
          python /tmp/vertical_extremes.py
      - name: Upload vertical extremes audit
        uses: actions/upload-artifact@v4
        with:
          name: fv-usgs-ia-eastern-1-vertical-extremes
          path: lidar-vertical-extremes/audit/
          if-no-files-found: error
          retention-days: 30
  lidar_ept_spatial_quality:
    if: ${{ contains(github.event.head_commit.message, '[lidar-spatial-quality]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download exact-record deduplicated cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lidar-spatial-quality/input
          gh run download 42820788907 --repo "$GITHUB_REPOSITORY" \
            --name fv-usgs-ia-eastern-1-exact-record-deduplicated \
            --dir lidar-spatial-quality/input
      - name: Install point-cloud analysis and plotting libraries
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lidar
          create-args: >-
            -c conda-forge
            python
            laspy
            lazrs-python
            numpy
            matplotlib
            pyproj
          cache-environment: true
          init-shell: bash
      - name: Spatial coverage, vertical distribution and 3D preview
        shell: bash -el {0}
        run: |
          cat > /tmp/spatial_quality.py <<'PY'
          import hashlib,json,pathlib,time
          import laspy
          import numpy as np
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from mpl_toolkits.mplot3d import Axes3D  # noqa: F401
          from pyproj import CRS

          root=pathlib.Path("lidar-spatial-quality")
          files=list((root/"input").rglob("ia_eastern_1_four_window_exact_record_deduplicated.laz"))
          if len(files)!=1: raise RuntimeError(f"Expected exactly one deduplicated LAZ, found {files}")
          src=files[0]
          out=root/"output";out.mkdir(parents=True,exist_ok=True)
          audit=root/"audit";audit.mkdir(parents=True,exist_ok=True)
          h=hashlib.sha256()
          with src.open("rb") as f:
              for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
          source_hash=h.hexdigest()

          # First pass: exact extent, point count, Z distribution, class counts,
          # and deterministic spatially distributed sample for a 3D preview.
          sample_parts=[]
          z_sample=[]
          class_counts={}
          n=0
          xmin=ymin=zmin=float("inf");xmax=ymax=zmax=float("-inf")
          sample_stride=40
          with laspy.open(src) as reader:
              header=reader.header
              header_count=header.point_count
              crs=header.parse_crs()
              if crs is None: raise RuntimeError("Input cloud has no parseable CRS")
              for pts in reader.chunk_iterator(250_000):
                  x=pts.x;y=pts.y;z=pts.z
                  if len(pts):
                      xmin=min(xmin,float(np.min(x)));xmax=max(xmax,float(np.max(x)))
                      ymin=min(ymin,float(np.min(y)));ymax=max(ymax,float(np.max(y)))
                      zmin=min(zmin,float(np.min(z)));zmax=max(zmax,float(np.max(z)))
                  if len(pts):
                      local=np.arange(len(pts))
                      chosen=np.flatnonzero((n+local)%sample_stride==0)
                      if len(chosen):
                          sample_parts.append(np.column_stack((x[chosen],y[chosen],z[chosen])))
                          z_sample.extend(np.asarray(z)[chosen].tolist())
                  cls=np.asarray(pts.classification)
                  vals,cnts=np.unique(cls,return_counts=True)
                  for v,k in zip(vals,cnts):class_counts[str(int(v))]=class_counts.get(str(int(v)),0)+int(k)
                  n+=len(pts)
          if n!=header_count: raise RuntimeError(f"Read count {n} != header {header_count}")
          sample=np.concatenate(sample_parts,axis=0)
          bounds=[xmin,ymin,xmax,ymax]
          width,height=xmax-xmin,ymax-ymin
          if width<=0 or height<=0: raise RuntimeError("Degenerate XY extent")
          # Grid diagnostics. Occupancy is measured from the actual point cloud,
          # not assumed from the nominal extraction windows.
          cell=10.0
          nx=max(1,int(np.ceil(width/cell)));ny=max(1,int(np.ceil(height/cell)))
          counts,xe,ye=np.histogram2d(sample[:,0],sample[:,1],bins=(nx,ny),range=((xmin,xmax),(ymin,ymax)))
          # Correct sampled density to full-cloud approximate counts.
          density=counts*sample_stride
          zmin_grid=np.full((nx,ny),np.nan);zmax_grid=np.full((nx,ny),np.nan)
          zsum=np.zeros((nx,ny));zcount=np.zeros((nx,ny),dtype=np.int64)
          # second pass: exact per-cell min/max/mean and occupancy
          with laspy.open(src) as reader:
              for pts in reader.chunk_iterator(250_000):
                  ix=np.clip(((pts.x-xmin)/width*nx).astype(int),0,nx-1)
                  iy=np.clip(((pts.y-ymin)/height*ny).astype(int),0,ny-1)
                  zz=np.asarray(pts.z)
                  for a,b,v in zip(ix,iy,zz):
                      if np.isnan(zmin_grid[a,b]) or v<zmin_grid[a,b]:zmin_grid[a,b]=v
                      if np.isnan(zmax_grid[a,b]) or v>zmax_grid[a,b]:zmax_grid[a,b]=v
                      zsum[a,b]+=v;zcount[a,b]+=1
          zmean=np.divide(zsum,zcount,out=np.full_like(zsum,np.nan),where=zcount>0)
          occupied=int(np.count_nonzero(zcount))
          total_cells=nx*ny
          zvals=np.asarray(z_sample)
          stats={
            "status":"SPATIAL_QUALITY_ANALYSIS_COMPLETE",
            "source_file":src.name,"source_sha256":source_hash,"point_count":n,
            "crs_wkt":crs.to_wkt(),"point_format_id":int(header.point_format.id),
            "xy_bounds":[xmin,ymin,xmax,ymax],"xy_extent_m":[width,height],
            "z_bounds_m":[zmin,zmax],
            "z_percentiles_m":{str(p):float(np.percentile(zvals,p)) for p in [0,1,5,25,50,75,95,99,100]},
            "classification_counts":class_counts,
            "grid":{"cell_size_m":cell,"columns":nx,"rows":ny,"total_cells":total_cells,"occupied_cells":occupied,"occupancy_fraction":occupied/total_cells,"point_count_per_occupied_cell":{"min":int(zcount[zcount>0].min()),"median":float(np.median(zcount[zcount>0])),"max":int(zcount.max())}},
            "sample_for_3d_preview":{"stride":sample_stride,"point_count":int(len(sample))},
            "interpretation_limits":["Z percentiles use a deterministic spatially distributed point sample; exact Z extrema and per-cell statistics use all points.","Classification codes are reported as stored; no class semantics or ground classification are inferred.","A 10 m grid is a diagnostic summary, not a generated terrain surface or mesh.","No ground filtering, interpolation, smoothing, vertical correction, or synthetic geometry was applied."]
          }
          # Density image
          fig,ax=plt.subplots(figsize=(10,8))
          im=ax.imshow(np.log10(density.T+1),origin="lower",extent=[xmin,xmax,ymin,ymax],aspect="equal")
          ax.set(title="USGS IA Eastern 1 — point density (log10 sampled estimate)",xlabel="X (EPSG:3857 metres)",ylabel="Y (EPSG:3857 metres)")
          fig.colorbar(im,ax=ax,label="log10(estimated points per 10 m cell + 1)")
          fig.tight_layout();fig.savefig(out/"point_density_10m.png",dpi=180);plt.close(fig)
          # Mean elevation grid
          fig,ax=plt.subplots(figsize=(10,8))
          im=ax.imshow(zmean.T,origin="lower",extent=[xmin,xmax,ymin,ymax],aspect="equal")
          ax.set(title="USGS IA Eastern 1 — mean elevation per occupied 10 m cell",xlabel="X (EPSG:3857 metres)",ylabel="Y (EPSG:3857 metres)")
          fig.colorbar(im,ax=ax,label="Mean Z (source units)")
          fig.tight_layout();fig.savefig(out/"mean_elevation_10m.png",dpi=180);plt.close(fig)
          # 3D point preview; raw sampled observations, no surface invented.
          fig=plt.figure(figsize=(12,9));ax=fig.add_subplot(111,projection="3d")
          sc=ax.scatter(sample[:,0],sample[:,1],sample[:,2],c=sample[:,2],s=0.25,alpha=0.55)
          ax.set(title="USGS IA Eastern 1 — sampled raw LiDAR points",xlabel="X (m)",ylabel="Y (m)",zlabel="Z (source units)")
          fig.colorbar(sc,ax=ax,shrink=0.55,label="Z (source units)")
          fig.tight_layout();fig.savefig(out/"raw_point_cloud_3d.png",dpi=180);plt.close(fig)
          (audit/"spatial_quality_receipt.json").write_text(json.dumps(stats,indent=2)+"\n")
          print(json.dumps(stats,indent=2))
          PY
          python /tmp/spatial_quality.py
      - name: Upload spatial quality report and visual previews
        uses: actions/upload-artifact@v4
        with:
          name: fv-usgs-ia-eastern-1-spatial-quality
          path: |
            lidar-spatial-quality/output/
            lidar-spatial-quality/audit/
          if-no-files-found: error
          retention-days: 30
  lidar_ept_exact_record_dedup:
    if: ${{ contains(github.event.head_commit.message, '[lidar-exact-dedup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable source extracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lidar-exact-dedup/input
          gh run download 42806517173 --repo "$GITHUB_REPOSITORY" \
            --name fv-usgs-ia-eastern-1-overlapping-laz-extracts \
            --dir lidar-exact-dedup/input
      - name: Install point-cloud processing libraries
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lidar
          create-args: >-
            -c conda-forge
            python
            laspy
            lazrs-python
            numpy
            pyproj
          cache-environment: true
          init-shell: bash
      - name: Exact full-record deduplication with conservation audit
        shell: bash -el {0}
        run: |
          cat > /tmp/exact_dedup.py <<'PY'
          import hashlib, json, pathlib, sqlite3, time
          import laspy
          import numpy as np
          from pyproj import CRS

          root=pathlib.Path("lidar-exact-dedup")
          inputs=root/"input"/"point-clouds"
          output=root/"output";audit=root/"audit"
          output.mkdir(parents=True,exist_ok=True);audit.mkdir(parents=True,exist_ok=True)
          names=["nw","ne","sw","se"]
          files=[inputs/f"ia_eastern_1_{n}.laz" for n in names]
          if not all(p.is_file() and p.stat().st_size for p in files):
              raise RuntimeError("One or more immutable source LAZ files are missing/empty")

          def sha256(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
              return h.hexdigest()

          headers=[laspy.open(p).header for p in files]
          first=headers[0]
          def crs_text(h):
              c=h.parse_crs()
              return c.to_wkt() if c else None
          baseline={
            "point_format_id":int(first.point_format.id),
            "point_record_length":int(first.point_format.size),
            "scales":[float(x) for x in first.scales],
            "offsets":[float(x) for x in first.offsets],
            "crs_wkt":crs_text(first)
          }
          for p,h in zip(files[1:],headers[1:]):
              candidate={
                "point_format_id":int(h.point_format.id),
                "point_record_length":int(h.point_format.size),
                "scales":[float(x) for x in h.scales],
                "offsets":[float(x) for x in h.offsets],
                "crs_wkt":crs_text(h)
              }
              if candidate!=baseline:
                  raise RuntimeError(f"Header/CRS mismatch in {p.name}: {candidate} != {baseline}")

          dbpath=audit/"exact_record_index.sqlite"
          if dbpath.exists():dbpath.unlink()
          db=sqlite3.connect(dbpath)
          db.execute("PRAGMA journal_mode=WAL")
          db.execute("PRAGMA synchronous=NORMAL")
          db.execute("PRAGMA temp_store=FILE")
          db.execute("CREATE TABLE seen (record BLOB PRIMARY KEY, first_source TEXT NOT NULL) WITHOUT ROWID")
          merged=output/"ia_eastern_1_four_window_exact_record_deduplicated.laz"
          per_source=[]
          total_in=total_out=total_dupes=0
          started=time.time()
          with laspy.open(merged,mode="w",header=first) as writer:
              for source,p in zip(names,files):
                  source_in=source_out=0
                  with laspy.open(p) as reader:
                      for points in reader.chunk_iterator(100_000):
                          arr=np.ascontiguousarray(points.array)
                          keep=[]
                          records=arr.tobytes()
                          width=arr.dtype.itemsize
                          for i in range(len(arr)):
                              raw=records[i*width:(i+1)*width]
                              cur=db.execute("INSERT OR IGNORE INTO seen(record,first_source) VALUES (?,?)",(sqlite3.Binary(raw),source))
                              if cur.rowcount==1:keep.append(i)
                          if keep:
                              writer.write_points(points[np.asarray(keep,dtype=np.int64)])
                          n=len(arr);k=len(keep)
                          source_in+=n;source_out+=k
                  source_dupes=source_in-source_out
                  total_in+=source_in;total_out+=source_out;total_dupes+=source_dupes
                  per_source.append({"source":source,"input_records":source_in,"written_unique_records":source_out,"exact_full_record_duplicates_suppressed":source_dupes})
                  db.commit()
                  print(json.dumps(per_source[-1]))
          db.close()
          if total_in!=7114393:
              raise RuntimeError(f"Input count mismatch: {total_in}")
          if total_in-total_dupes!=total_out:
              raise RuntimeError("Record conservation arithmetic failed")
          with laspy.open(merged) as reader:
              verify_count=reader.header.point_count
              if verify_count!=total_out:raise RuntimeError(f"Output header count {verify_count} != written count {total_out}")
              output_crs=reader.header.parse_crs()
              source_crs=CRS.from_wkt(baseline["crs_wkt"]) if baseline["crs_wkt"] else None
              crs_ok=(output_crs is not None and source_crs is not None and output_crs.equals(source_crs))
              verify_format={"point_format_id":int(reader.header.point_format.id),"scales":[float(x) for x in reader.header.scales],"offsets":[float(x) for x in reader.header.offsets],"crs_semantically_equal":crs_ok}
              if verify_format["point_format_id"]!=baseline["point_format_id"] or verify_format["scales"]!=baseline["scales"] or verify_format["offsets"]!=baseline["offsets"] or not crs_ok:
                  raise RuntimeError(f"Output header/CRS differs from source baseline: {verify_format}; baseline={baseline}")
          receipt={
            "status":"EXACT_FULL_RECORD_DEDUPLICATION_PASS",
            "dataset":"USGS 3DEP IA_Eastern_1_2019",
            "deduplication_key":"byte-for-byte complete LAS point record (all stored dimensions)",
            "header_and_crs_consistent":True,
            "header":baseline,
            "sources":per_source,
            "input_record_count":total_in,
            "output_record_count":total_out,
            "exact_full_record_duplicates_suppressed":total_dupes,
            "record_conservation":total_in==total_out+total_dupes,
            "output":{"file":str(merged),"bytes":merged.stat().st_size,"sha256":sha256(merged),"point_count":verify_count},
            "source_hashes":[{"file":p.name,"sha256":sha256(p)} for p in files],
            "elapsed_seconds":round(time.time()-started,2),
            "limitations":["Deduplication is exact full-record equality only; XYZ-only matches with any differing point-record byte are retained.","This is a bounded four-window test, not a claim about the entire USGS EPT collection."]
          }
          (audit/"exact_record_dedup_receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
          python /tmp/exact_dedup.py
      - name: Upload deduplicated point cloud and audit
        uses: actions/upload-artifact@v4
        with:
          name: fv-usgs-ia-eastern-1-exact-record-deduplicated
          path: |
            lidar-exact-dedup/output/
            lidar-exact-dedup/audit/exact_record_dedup_receipt.json
          if-no-files-found: error
          retention-days: 30
  lidar_ept_record_identity:
    if: ${{ contains(github.event.head_commit.message, '[lidar-record-identity]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable source extracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lidar-record-identity/input
          gh run download 42806517173 --repo "$GITHUB_REPOSITORY" \
            --name fv-usgs-ia-eastern-1-overlapping-laz-extracts \
            --dir lidar-record-identity/input
      - name: Install PDAL and point-record inspection libraries
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdal
          create-args: >-
            -c conda-forge
            pdal
            python
            numpy
            laspy
            lazrs-python
          cache-environment: true
          init-shell: bash
      - name: Compare complete point records, not just XYZ
        shell: bash -el {0}
        run: |
          cat > /tmp/record_identity.py <<'PY'
          import json, pathlib, subprocess
          import laspy
          import numpy as np

          root=pathlib.Path("lidar-record-identity")
          inputs=root/"input"/"point-clouds"
          out=root/"audit";out.mkdir(parents=True,exist_ok=True)
          q=json.loads((root/"input"/"source-metadata"/"query.json").read_text())
          windows={x["id"]:x["bounds_xy"] for x in q["windows"]}
          pairs=[("NW","NE"),("SW","SE"),("NW","SW"),("NE","SE")]

          def crop(src,bounds,target):
              x0,y0,x1,y1=bounds
              spec={"pipeline":[
                {"type":"readers.las","filename":str(src)},
                {"type":"filters.crop","bounds":f"([{x0:.3f}, {x1:.3f}], [{y0:.3f}, {y1:.3f}])"},
                {"type":"writers.las","filename":str(target),"compression":True}
              ]}
              p=target.with_suffix(".json");p.write_text(json.dumps(spec))
              r=subprocess.run(["pdal","pipeline",str(p)],text=True,capture_output=True)
              if r.returncode: raise RuntimeError(r.stderr[-4000:])
              p.unlink()
              return target

          def raw_records(las):
              arr=np.ascontiguousarray(las.points.array)
              return arr.view(np.dtype((np.void,arr.dtype.itemsize))).reshape(-1)

          def xyz_records(las):
              arr=np.empty(len(las),dtype=[("x","<i4"),("y","<i4"),("z","<i4")])
              arr["x"],arr["y"],arr["z"]=las.X,las.Y,las.Z
              return arr.view(np.dtype((np.void,arr.dtype.itemsize))).reshape(-1)

          def multiset_intersection(a,b):
              ua,ca=np.unique(a,return_counts=True)
              ub,cb=np.unique(b,return_counts=True)
              common,ia,ib=np.intersect1d(ua,ub,assume_unique=True,return_indices=True)
              return int(np.minimum(ca[ia],cb[ib]).sum()),int(len(ua)),int(len(ub))

          reports=[]
          for left,right in pairs:
              a,b=windows[left],windows[right]
              bounds=[max(a[0],b[0]),max(a[1],b[1]),min(a[2],b[2]),min(a[3],b[3])]
              paths=[]
              for label in [left,right]:
                  src=inputs/f"ia_eastern_1_{label.lower()}.laz"
                  paths.append(crop(src,bounds,out/f"{left.lower()}_{right.lower()}_{label.lower()}.laz"))
              with laspy.open(paths[0]) as f: la=f.read()
              with laspy.open(paths[1]) as f: lb=f.read()
              ra,rb=raw_records(la),raw_records(lb)
              xa,xb=xyz_records(la),xyz_records(lb)
              exact,ua,ub=multiset_intersection(ra,rb)
              xyz_common,uxa,uxb=multiset_intersection(xa,xb)
              report={
                "pair":f"{left}-{right}",
                "left_records":len(ra),"right_records":len(rb),
                "left_unique_full_records":ua,"right_unique_full_records":ub,
                "exact_full_record_multiset_intersection":exact,
                "left_unique_xyz":uxa,"right_unique_xyz":uxb,
                "xyz_multiset_intersection":xyz_common,
                "full_record_overlap_fraction_of_left":exact/len(ra) if len(ra) else None,
                "full_record_overlap_fraction_of_right":exact/len(rb) if len(rb) else None,
                "same_xyz_but_not_same_full_record_count_estimate":max(0,xyz_common-exact),
                "raw_point_record_dtype":str(la.points.array.dtype),
                "interpretation":"Full point record equality includes all stored LAS point dimensions and extra bytes; multiset counts preserve repeated records."
              }
              reports.append(report);print(json.dumps(report,indent=2))
              for p in paths:p.unlink()

          result={
            "status":"FULL_RECORD_IDENTITY_AUDIT_COMPLETE",
            "dataset":"USGS 3DEP IA_Eastern_1_2019",
            "pairs":reports,
            "safe_deduplication_basis":"Only exact full-record duplicates, counted as a multiset, qualify as duplicate records in the tested overlap strips. XYZ-only matches remain distinct unless full records match.",
            "limitations":["Only four pairwise overlap strips were tested; not the full four-window union.","Full-record byte identity is exact and intentionally does not merge semantically similar records."]
          }
          (out/"full_record_identity_receipt.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
          pdal --version
          python /tmp/record_identity.py
      - name: Upload full point-record identity receipt
        uses: actions/upload-artifact@v4
        with:
          name: fv-usgs-ia-eastern-1-full-record-identity
          path: lidar-record-identity/audit/
          if-no-files-found: error
          retention-days: 30
  lidar_ept_duplicate_detail:
    if: ${{ contains(github.event.head_commit.message, '[lidar-duplicate-detail]') }}
    runs-on: ubuntu-latest

name: FV Assemble — BigStitcher OSF mirror intake

on:
  push:
    branches:
      - experiment/hst-single-visit-ngc3370
    paths:
      - ".github/workflows/fv-bigstitcher-osf-intake.yml"

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect OSF project tree and retrieve named example archives
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          mkdir -p bigstitcher-osf-intake/downloads bigstitcher-osf-intake/receipts
          cat > /tmp/intake.py <<'PY'
          import hashlib, json, pathlib, time, zipfile
          import requests

          OUT = pathlib.Path("bigstitcher-osf-intake")
          API = "https://api.osf.io/v2/nodes/bufza/files/osfstorage/"
          S = requests.Session()
          S.headers.update({"User-Agent": "FakingVision-DataIntake/1.0", "Accept": "application/vnd.api+json"})
          seen, inventory, raw_nodes = set(), [], []

          def get_json(url):
              for attempt in range(5):
                  r = S.get(url, timeout=(30, 120))
                  if r.status_code in (429, 500, 502, 503, 504):
                      time.sleep(2 ** attempt)
                      continue
                  r.raise_for_status()
                  return r.json()
              raise RuntimeError(f"OSF API remained unavailable: {url}")

          def walk(url):
              if not url or url in seen:
                  return
              seen.add(url)
              payload = get_json(url)
              raw_nodes.append({"requested_url": url, "payload": payload})
              for item in payload.get("data", []):
                  attr = item.get("attributes", {})
                  links = item.get("links", {})
                  rel = item.get("relationships", {})
                  kind = attr.get("kind")
                  inventory.append({
                      "id": item.get("id"), "name": attr.get("name"),
                      "kind": kind, "size": attr.get("size"),
                      "path": attr.get("materialized_path"),
                      "download_url": links.get("download"),
                      "links": links, "relationships": rel,
                  })
                  related = rel.get("files", {}).get("links", {}).get("related", {}).get("href")
                  if related:
                      walk(related)
              walk(payload.get("links", {}).get("next"))

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          (OUT / "receipts").mkdir(parents=True, exist_ok=True)
          (OUT / "downloads").mkdir(parents=True, exist_ok=True)
          walk(API)
          (OUT / "receipts/osf_inventory.json").write_text(json.dumps(inventory, indent=2) + "\n")
          (OUT / "receipts/osf_api_structure.json").write_text(json.dumps(raw_nodes, indent=2) + "\n")
          files = [x for x in inventory if x["kind"] == "file" or x["download_url"]]
          targets = [x for x in files if x["name"] and any(k in x["name"].lower() for k in ("grid_2d", "grid_3d"))]
          print("OSF entries discovered:", len(inventory))
          print("File candidates:", len(files))
          print("BigStitcher candidates:", json.dumps(targets, indent=2))
          receipts = []
          for item in targets:
              url = item.get("download_url")
              if not url:
                  receipts.append({"source": item, "status": "NO_DOWNLOAD_LINK"})
                  continue
              dest = OUT / "downloads" / item["name"]
              with S.get(url, stream=True, timeout=(30, 300)) as r:
                  r.raise_for_status()
                  with dest.open("wb") as f:
                      for chunk in r.iter_content(1024 * 1024):
                          if chunk:
                              f.write(chunk)
              rec = {"source": item, "status": "DOWNLOADED", "filename": dest.name,
                     "bytes": dest.stat().st_size, "sha256": sha256(dest),
                     "is_zip": zipfile.is_zipfile(dest)}
              if not rec["is_zip"]:
                  raise RuntimeError(f"Candidate is not a ZIP archive: {dest.name}")
              with zipfile.ZipFile(dest) as z:
                  bad = z.testzip()
                  rec["zip_crc_test"] = "PASS" if bad is None else f"FAIL: {bad}"
                  rec["members"] = [{"name": i.filename, "bytes": i.file_size} for i in z.infolist() if not i.is_dir()]
              if bad:
                  raise RuntimeError(f"ZIP CRC test failed: {dest.name}: {bad}")
              receipts.append(rec)
              print(json.dumps(rec, indent=2))
          (OUT / "receipts/download_receipts.json").write_text(json.dumps(receipts, indent=2) + "\n")
          if not targets:
              print("No Grid_2d/Grid_3d-named archive was found; full API tree and raw responses retained for inspection.")
          PY
          python /tmp/intake.py
      - name: Upload OSF inventory, API structure and any original downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fv-bigstitcher-osf-source-intake
          path: bigstitcher-osf-intake/
          if-no-files-found: warn
          retention-days: 30

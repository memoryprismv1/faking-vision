name: Fullerton source acquisition

on:
  push:
    branches:
      - "work/fv-fullerton-legacy-provenance-20261113"
    paths:
      - "TOOLS/acquire_fullerton_source.py"
      - ".github/workflows/fullerton-source-acquisition.yml"
  pull_request:
    paths:
      - "TOOLS/acquire_fullerton_source.py"
      - ".github/workflows/fullerton-source-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-and-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Acquire and fingerprint Commons source
        run: python3 TOOLS/acquire_fullerton_source.py --output-dir fullerton-acquisition
      - name: Upload source and aligned evidence
        uses: actions/upload-artifact@v4
        with:
          name: fullerton-source-acquisition
          path: fullerton-acquisition/
          if-no-files-found: error
          retention-days: 30

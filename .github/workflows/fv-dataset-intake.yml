name: FV public dataset intake receipts
on:
  push:
    branches:
      - work/fv-dataset-receipts-20261107
    paths:
      - ".github/workflows/fv-dataset-intake.yml"
      - "tools/dataset-intake/collect.py"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout intake script
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inspection tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests astroquery astropy pillow tifffile numpy boto3 lazrs
      - name: Download and inspect public datasets
        run: python tools/dataset-intake/collect.py intake
      - name: Verify receipt bundle exists
        run: |
          test -s intake/RECEIPTS.md
          test -s intake/inspection/receipts.json
          test -s intake/inspection/file_manifest.json
      - name: Upload downloadable receipt bundle and source samples
        uses: actions/upload-artifact@v4
        with:
          name: fv-overlapping-media-dataset-intake
          path: intake/
          if-no-files-found: error
          retention-days: 30

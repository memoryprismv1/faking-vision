name: Legacy dataset provenance

on:
  push:
    branches:
      - "work/fv-legacy-dataset-provenance-20261113"
    paths:
      - "TOOLS/query_hubble_udf_mast.py"
      - "TOOLS/verify_kitti_odometry_inputs.py"
      - ".github/workflows/legacy-dataset-provenance.yml"
  pull_request:
    paths:
      - "TOOLS/query_hubble_udf_mast.py"
      - "TOOLS/verify_kitti_odometry_inputs.py"
      - ".github/workflows/legacy-dataset-provenance.yml"
      - "SPECIFICATION/FV_Packet_Provenance_Schema.json"
      - "TOOLS/test_fv_packet_provenance_schema.py"

permissions:
  contents: read

jobs:
  metadata-and-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata and schema dependencies
        run: python -m pip install --upgrade astroquery astropy jsonschema
      - name: Compile provenance tools
        run: python -m py_compile TOOLS/query_hubble_udf_mast.py TOOLS/verify_kitti_odometry_inputs.py
      - name: Validate packet provenance schema tests
        run: python -m unittest TOOLS/test_fv_packet_provenance_schema.py -v
      - name: Query Hubble UDF MAST metadata
        run: python TOOLS/query_hubble_udf_mast.py --output-dir hubble-udf-mast
      - name: Upload Hubble metadata manifest
        uses: actions/upload-artifact@v4
        with:
          name: hubble-udf-mast-manifest
          path: hubble-udf-mast/
          if-no-files-found: error
          retention-days: 30
